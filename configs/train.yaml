# ============================================================
# Training Configuration
# ============================================================
# Controls the entire training pipeline: data, optimizer,
# scheduler, callbacks, logging, and hardware settings.
# ============================================================

# --- Paths ---
paths:
  images_dir: "dataset/images"
  masks_dir: "dataset/masks"
  patches_dir: "dataset/patches"
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"
  vis_dir: "outputs/visualizations"

# --- Data ---
data:
  patch_size: 256
  overlap: 64              # Overlap in pixels between patches
  val_split: 0.2           # 80/20 train/val split
  num_workers: 0
  pin_memory: false

# --- Preprocessing ---
preprocessing:
  target_size: [1024, 1024]  # Resize raw images before patching
  clahe:
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  denoise:
    strength: 10
  normalize: true

# --- Augmentation ---
augmentation:
  enabled: true
  rotation_limit: 15
  scale_limit: 0.1
  shift_limit: 0.05
  brightness_limit: 0.2
  contrast_limit: 0.2
  gaussian_blur_limit: [3, 7]
  gaussian_noise_var_limit: [10.0, 50.0]
  elastic_transform:
    alpha: 120
    sigma: 6
  probability: 0.5          # Per-augmentation probability

# --- Training ---
training:
  epochs: 10
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  gradient_clip_value: 1.0

  # Loss
  loss:
    type: "bce_dice"        # Options: bce, dice, bce_dice
    bce_weight: 0.5
    dice_weight: 0.5

  # Optimizer
  optimizer: "adamw"

  # Scheduler
  scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-7

  # Callbacks
  early_stopping:
    patience: 15
    monitor: "val_loss"
    mode: "min"

  # Checkpointing
  save_best_only: true
  save_every_n_epochs: 10

# --- Hardware ---
hardware:
  device: "auto"           # auto | cuda | mps | cpu
  mixed_precision: false
  seed: 42

# --- Logging ---
logging:
  tensorboard: true
  wandb: false
  log_every_n_steps: 10
  visualize_every_n_epochs: 5
